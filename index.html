<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My E-Commerce Store</h1>
        <p>Simple Online Store</p>
    </header>

    <div class="container">

        <h2>Products</h2>

        <div class="products">

            <div class="product">
                <h3>Laptop</h3>
                <p>Rs. 80,000</p>
                <button onclick="addToCart('Laptop', 80000)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <h3>Headphones</h3>
                <p>Rs. 5,000</p>
                <button onclick="addToCart('Headphones', 5000)">
                    Add to Cart
                </button>
            </div>

            <div class="product">
                <h3>Smart Watch</h3>
                <p>Rs. 10,000</p>
                <button onclick="addToCart('Smart Watch', 10000)">
                    Add to Cart
                </button>
            </div>

        </div>

        <h2>Shopping Cart</h2>

        <div id="cart"></div>

        <h3>Total: Rs. <span id="total">0</span></h3>

    </div>

    <script src="script.js"></script>
</body>
</html>
